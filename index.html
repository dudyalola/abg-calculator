<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IM Tools</title>
<meta name="description" content="Preop clearance, ABG and the OPD follow-up calendar in one app.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IM Tools">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f4f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* One shell, three tools. Each tool is its own page in a same-origin iframe:
   the calendar is served from its own repo (../opd-calendar/) and keeps its
   own service worker; the ABG calculator (abg/) and preop (preop/) live here,
   under this folder's worker. Frames are stacked and hidden with
   visibility, not display:none, so a tool that loads in the background still
   lays out at full size and keeps its scroll and inputs across tab switches. */
:root{
  --bg:#f5f4f1; --bar:#fbfaf8; --line:#dedad2; --ink:#1b1f23; --sub:#6b7380;
  --on:#00695c;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --bar:#181b1e; --line:#2c3136; --ink:#e9e7e3; --sub:#8f98a3;
    --on:#5fc1b2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --bar:#181b1e; --line:#2c3136; --ink:#e9e7e3; --sub:#8f98a3;
  --on:#5fc1b2; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

/* status-bar strip: black-translucent draws the clock over the page, so the
   shell paints that inset in the active tool's own background colour */
.inset-top{flex:none;height:env(safe-area-inset-top,0px);background:var(--top,var(--bg));
  transition:background-color .2s}

main{position:relative;flex:1;min-height:0;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;
  background:var(--bg);visibility:hidden}
main iframe.on{visibility:visible}

.offline{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  padding:24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.5}
.offline.on{display:flex}

nav.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--bar);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs button{appearance:none;border:0;background:none;font:inherit;color:var(--sub);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:52px;padding:6px 0 4px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}
nav.tabs button svg{width:25px;height:25px;flex:none}
nav.tabs button span{font-size:10.5px;font-weight:600;letter-spacing:.1px}
nav.tabs button[aria-selected="true"]{color:var(--on)}
nav.tabs button:focus-visible{outline:2px solid var(--on);outline-offset:-4px;border-radius:10px}

@media (min-width:700px){
  nav.tabs{grid-template-columns:repeat(3,minmax(0,150px));justify-content:center}
  nav.tabs button{flex-direction:row;gap:7px;height:48px}
  nav.tabs button span{font-size:12.5px}
  nav.tabs button svg{width:21px;height:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="inset-top" aria-hidden="true"></div>

<main id="stage">
  <iframe id="f-preop" title="Preop clearance" data-src="preop/"></iframe>
  <iframe id="f-abg"   title="ABG calculator"  data-src="abg/"></iframe>
  <iframe id="f-cal"   title="OPD follow-up calendar" data-src="../opd-calendar/"></iframe>
  <div class="offline" id="offline">This tool hasn't been opened with signal on this device yet, so there's no offline copy. Open it once on Wi-Fi.</div>
</main>

<nav class="tabs" role="tablist" aria-label="Tools">
  <button role="tab" id="t-preop" data-tab="preop" aria-controls="f-preop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="5" y="4" width="14" height="17" rx="2.2"/><path d="M9 4V3h6v1"/><path d="M8.5 13.5h2l1.3-3 2 5.5 1.2-2.5h.5"/>
    </svg><span>Preop</span>
  </button>
  <button role="tab" id="t-abg" data-tab="abg" aria-controls="f-abg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.2c3.3 4.1 6 7.5 6 10.9a6 6 0 0 1-12 0c0-3.4 2.7-6.8 6-10.9z"/><path d="M9.3 15.2a2.8 2.8 0 0 0 2.4 2.3"/>
    </svg><span>ABG</span>
  </button>
  <button role="tab" id="t-cal" data-tab="cal" aria-controls="f-cal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="5" width="16" height="15" rx="2.2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M9 15l2 2 4-4"/>
    </svg><span>Calendar</span>
  </button>
</nav>

<script>
(function () {
  var TABS = ["preop", "abg", "cal"];
  var KEY = "imtools.tab";
  var frames = {}, btns = {};
  TABS.forEach(function (t) {
    frames[t] = document.getElementById("f-" + t);
    btns[t] = document.getElementById("t-" + t);
  });
  var offline = document.getElementById("offline");
  var meta = document.querySelector('meta[name="theme-color"]');
  var current = null;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function load(t) {
    var f = frames[t];
    if (!f.getAttribute("src")) f.setAttribute("src", f.dataset.src);
  }

  /* a frame whose page couldn't load (offline, never cached) comes back as the
     browser's error page — about:blank-ish, no body content from the tool */
  function broken(t) {
    var f = frames[t];
    if (!f.getAttribute("src")) return false;
    try {
      var d = f.contentDocument;
      if (!d || !d.body) return false;           // still loading
      return d.readyState === "complete" && !d.body.children.length;
    } catch (e) { return false; }
  }

  /* paint the status-bar strip and theme-color with the tool's own background */
  function tint() {
    var col = "";
    try {
      var d = frames[current].contentDocument;
      if (d && d.body) {
        col = getComputedStyle(d.body).backgroundColor;
        if (!col || col === "rgba(0, 0, 0, 0)" || col === "transparent")
          col = getComputedStyle(d.documentElement).backgroundColor;
      }
    } catch (e) {}
    if (!col || col === "rgba(0, 0, 0, 0)" || col === "transparent") col = "";
    document.documentElement.style.setProperty("--top", col || "var(--bg)");
    meta.setAttribute("content", col || getComputedStyle(document.body).backgroundColor);
  }

  function show(t, fromHash) {
    if (TABS.indexOf(t) < 0) t = "preop";
    if (t === current) return;
    current = t;
    load(t);
    TABS.forEach(function (x) {
      var on = x === t;
      frames[x].classList.toggle("on", on);
      frames[x].setAttribute("aria-hidden", on ? "false" : "true");
      btns[x].setAttribute("aria-selected", on ? "true" : "false");
      btns[x].tabIndex = on ? 0 : -1;
    });
    offline.classList.toggle("on", broken(t));
    store(KEY, t);
    if (!fromHash) history.replaceState(null, "", "#" + t);
    tint();
  }

  /* tapping the tab you're already on scrolls that tool back to the top */
  function toTop(t) {
    try {
      var w = frames[t].contentWindow, d = w.document;
      w.scrollTo({ top: 0, behavior: "smooth" });
      var s = d.scrollingElement; if (s) s.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {}
  }

  TABS.forEach(function (t) {
    btns[t].addEventListener("click", function () {
      if (t === current) toTop(t); else show(t);
    });
    frames[t].addEventListener("load", function () {
      if (t === current) { offline.classList.toggle("on", broken(t)); tint(); }
      /* follow the tool's own light/dark switch, if it has one */
      try {
        new MutationObserver(function () { if (t === current) tint(); })
          .observe(frames[t].contentDocument.documentElement,
                   { attributes: true, attributeFilter: ["data-theme", "class", "style"] });
      } catch (e) {}
    });
  });

  /* arrow keys across the tab bar */
  document.querySelector("nav.tabs").addEventListener("keydown", function (e) {
    var i = TABS.indexOf(current);
    if (e.key === "ArrowRight") i = (i + 1) % TABS.length;
    else if (e.key === "ArrowLeft") i = (i + TABS.length - 1) % TABS.length;
    else return;
    e.preventDefault(); show(TABS[i]); btns[TABS[i]].focus();
  });

  window.addEventListener("hashchange", function () { show(location.hash.slice(1), true); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { setTimeout(tint, 50); });

  var start = location.hash.slice(1);
  show(TABS.indexOf(start) >= 0 ? start : (recall(KEY) || "preop"), TABS.indexOf(start) >= 0);

  /* warm the other two after the first one is up, so each registers its own
     service worker and works offline before you ever open it */
  function warm() {
    var rest = TABS.filter(function (t) { return t !== current; });
    rest.forEach(function (t, i) { setTimeout(function () { load(t); }, 600 * (i + 1)); });
  }
  if (frames[current].contentDocument && frames[current].contentDocument.readyState === "complete") warm();
  else frames[current].addEventListener("load", warm, { once: true });
})();
</script>

<!--SW-->
<script>
if ("serviceWorker" in navigator && location.protocol === "https:" || location.hostname === "localhost") {
  var hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller), reloaded = false;
  if (navigator.serviceWorker) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) { reg.update(); }).catch(function () {});
    });
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloaded) return;
      reloaded = true;
      location.reload();
    });
  }
}
</script><!--/SW-->
</body>
</html>
